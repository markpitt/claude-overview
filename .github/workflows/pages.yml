name: Site

# The project's web site (site/), served by GitHub Pages at markpitt.dev/claude-overview/.
# Pull requests build and smoke-test it; a push to main also deploys it. The site's base path
# comes from SITE_BASE (default /claude-overview/).
on:
  pull_request:
    paths: ["site/**", "docs/screenshots/**", ".github/workflows/pages.yml"]
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: site

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build and test the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx astro check

      - name: Install Chromium for the smoke tests
        run: npx playwright install --with-deps chromium

      # Builds the site and serves it under its base path for the tests.
      - name: Smoke tests
        run: npx playwright test

      - name: Upload the Pages artefact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
